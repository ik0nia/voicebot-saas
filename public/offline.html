<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#dc2626">
    <title>Offline — Sambla Social</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
            padding: 24px;
            text-align: center;
        }
        .card {
            max-width: 420px;
        }
        img { width: 72px; height: 72px; margin-bottom: 24px; }
        h1 { margin: 0 0 12px; font-size: 22px; font-weight: 600; }
        p { margin: 0 0 24px; color: #94a3b8; line-height: 1.5; }
        button {
            background: #dc2626;
            color: white;
            border: 0;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #b91c1c; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/images/logo-icon.png" alt="Sambla">
        <h1>Ești offline</h1>
        <p>Nu am putut încărca pagina. Verifică conexiunea și încearcă din nou.</p>
        <button onclick="location.reload()">Reîncarcă</button>
    </div>
</body>
</html>
