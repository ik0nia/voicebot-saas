memory_limit = 512M
upload_max_filesize = 50M
post_max_size = 50M
max_execution_time = 120
max_input_time = 120
display_errors = Off
log_errors = On
error_log = /var/log/php/error.log
date.timezone = Europe/Bucharest
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
; Revalidate file mtimes every 2s instead of never. With the repo bind-mounted
; into the container, setting this to 0 meant edits to PHP files were
; invisible until php-fpm reloaded — and there's no deploy step that resets
; opcache. The 2s recheck costs ~5% throughput but lets code changes land
; without a manual USR2 / rebuild.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.jit = tracing
opcache.jit_buffer_size = 100M
realpath_cache_size = 32M
