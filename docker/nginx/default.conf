## CDN host — serves ONLY static assets. No PHP, no Laravel routing,
## no directory listing. Each static path has its own cache strategy.
## Anything outside whitelisted paths returns 404.
server {
    listen 80;
    server_name cdn.sambla.ro;
    root /var/www/html/public;
    server_tokens off;

    # Gzip is set per-server in nginx (not inherited from another server
    # block), so we have to enable it explicitly here too. Without this
    # CSS / JS / SVG / fonts.css responses came uncompressed and Pingdom
    # downgraded to E56.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/atom+xml
        application/ld+json
        application/wasm
        font/ttf
        font/otf
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "*" always;
    autoindex off;

    location = / { return 404; }

    # AI-generated social media images (SSD volume) — immutable, never change.
    location /social/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # User uploads — change occasionally per user, daily cache.
    location /uploads/ {
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Vite build assets — Vite hashes filenames so they're effectively
    # immutable: when content changes, the filename changes too.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Site images (logo, icons, hero) — change rarely, 7 day cache + revalidate.
    location /images/ {
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Static fonts.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Top-level CSS / JS dropped directly in public/
    location /css/ {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }
    location /js/ {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Widget JS — short cache so customer sites pick up updates fast.
    location /widget/ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # WooCommerce plugin archive — large files, daily cache.
    location /downloads/ {
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    # Common root-level static files (favicons, robots, etc.)
    location = /favicon.ico {
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri =404;
    }
    location = /favicon.svg {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / { return 404; }
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 50M;

    # Security headers — PSI flagged HSTS, COOP, XFO. Set globally so every
    # response (HTML and assets) carries them.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;

    # Compression — Pingdom flagged F45 because nginx wasn't sending gzip.
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/ld+json
        application/vnd.api+json
        application/wasm
        font/ttf
        font/otf
        image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # X-Frame-Options for non-chatbot routes (chatbot iframe must be embeddable on customer sites)
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # AI-generated social media images served from the dedicated SSD volume.
    # Files are public (Meta needs to fetch them when publishing) but
    # directory listing is explicitly disabled — a user who strips the
    # filename from the URL gets a 404, never a folder index.
    location /social/ {
        autoindex off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /uploads/ {
        autoindex off;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Vite build assets — Vite hashes filenames so they're effectively immutable.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Site images, fonts — long cache, browser revalidates if needed.
    location /images/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        try_files $uri =404;
    }
    location /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /css/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        try_files $uri =404;
    }
    location /js/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        try_files $uri =404;
    }
    location = /favicon.ico {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
    location = /favicon.svg {
        expires 7d;
        try_files $uri =404;
    }

    # Widget JS — always revalidate so clients get updates immediately
    location /widget/ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        resolver 127.0.0.11 valid=30s;
        set $app_upstream app:9000;
        fastcgi_pass $app_upstream;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        include fastcgi_params;
        fastcgi_buffering off;
        # Security headers (no X-Frame-Options — chatbot iframe must be embeddable)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ANCPI cadastral viewer (static files + PHP)
    location /ancpi {
        alias /var/www/html/public/ancpi;
        index index.html;

        location ~ \.(geojson|json)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
        }

        location ~ ^/ancpi/(.+\.php)$ {
            alias /var/www/html/public/ancpi/$1;
            resolver 127.0.0.11 valid=30s;
            set $app_upstream app:9000;
            fastcgi_pass $app_upstream;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/ancpi/$1;
            fastcgi_param HTTPS on;
            fastcgi_param HTTP_X_FORWARDED_PROTO https;
            fastcgi_buffering off;
        }
    }

    location /app {
        resolver 127.0.0.11 valid=30s;
        set $reverb_upstream http://reverb:8080;
        proxy_pass $reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
