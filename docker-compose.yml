services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voicebot-app
    restart: unless-stopped
    volumes:
      - /var/www/voicebot-saas:/var/www/html
      - app-storage:/var/www/html/storage
      # Dedicated SSD volume for AI-generated media — keeps growing files
      # off the project directory and allows future CDN/cache strategies.
      - /mnt/ssd-cdn/social:/var/www/html/public/social
      - /mnt/ssd-cdn/uploads:/var/www/html/public/uploads
    env_file:
      - .env
    environment:
      TZ: Europe/Bucharest
      APP_URL: https://sambla.ro
    healthcheck:
      test: ["CMD", "php-fpm-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=false"
    networks:
      default:
        aliases:
          - app
      coolify: {}

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: voicebot-nginx
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - /var/www/voicebot-saas/public:/var/www/html/public:ro
      - /mnt/ssd-cdn/social:/var/www/html/public/social:ro
      - /mnt/ssd-cdn/uploads:/var/www/html/public/uploads:ro
      - app-storage:/var/www/html/storage:ro
      - /home/sambla/ancpi/public:/var/www/html/public/ancpi:ro
    depends_on:
      app:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # Main site
      - "traefik.http.routers.voicebot.rule=Host(`sambla.ro`)"
      - "traefik.http.routers.voicebot.entryPoints=https"
      - "traefik.http.routers.voicebot.tls=true"
      - "traefik.http.routers.voicebot.tls.certresolver=letsencrypt"
      - "traefik.http.routers.voicebot.service=voicebot"
      # CDN host — explicit router so Traefik never falls back to a Coolify
      # auto-generated router that lacks a service (which caused 504s).
      - "traefik.http.routers.voicebot-cdn.rule=Host(`cdn.sambla.ro`)"
      - "traefik.http.routers.voicebot-cdn.entryPoints=https"
      - "traefik.http.routers.voicebot-cdn.tls=true"
      - "traefik.http.routers.voicebot-cdn.tls.certresolver=letsencrypt"
      - "traefik.http.routers.voicebot-cdn.service=voicebot"
      # Shared service definition both routers use.
      - "traefik.http.services.voicebot.loadbalancer.server.port=80"
    networks:
      default:
        aliases:
          - nginx
      coolify: {}

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voicebot-queue
    restart: unless-stopped
    command: sh -c "php artisan migrate --force && php artisan view:clear && php artisan horizon"
    volumes:
      - /var/www/voicebot-saas:/var/www/html
      - app-storage:/var/www/html/storage
      # Same SSD media mounts as app — queue jobs (BackfillSocialImages,
      # GenerateSocialDraft) write images here and the web tier serves them.
      - /mnt/ssd-cdn/social:/var/www/html/public/social
      - /mnt/ssd-cdn/uploads:/var/www/html/public/uploads
    env_file:
      - .env
    environment:
      TZ: Europe/Bucharest
      APP_URL: https://sambla.ro
    depends_on:
      app:
        condition: service_started
    labels:
      - "traefik.enable=false"
    networks:
      default: {}
      coolify: {}

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voicebot-scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      - /var/www/voicebot-saas:/var/www/html
      - app-storage:/var/www/html/storage
      - /mnt/ssd-cdn/social:/var/www/html/public/social
      - /mnt/ssd-cdn/uploads:/var/www/html/public/uploads
      - /mnt/hdd-backup:/backups
    env_file:
      - .env
    environment:
      TZ: Europe/Bucharest
      APP_URL: https://sambla.ro
    depends_on:
      app:
        condition: service_started
    labels:
      - "traefik.enable=false"
    networks:
      default: {}
      coolify: {}

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voicebot-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file:
      - .env
    environment:
      TZ: Europe/Bucharest
      APP_URL: https://sambla.ro
    depends_on:
      app:
        condition: service_started
    labels:
      - "traefik.enable=false"
    networks:
      default:
        aliases:
          - reverb
      coolify: {}

volumes:
  app-storage:

networks:
  default:
  coolify:
    external: true
